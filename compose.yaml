services:
  peach:
    image: longmeidao/peach:${PEACH_VERSION:-edge}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 75s
    ports:
      # NAS / 局域网：在 .env 中设置 PEACH_BIND 为宿主机的局域网 IP。
      # 127.0.0.1 仅供宿主机访问；PEACH_PORT 可修改宿主机端口。
      - "${PEACH_BIND:-127.0.0.1}:${PEACH_PORT:-8900}:8900"
    volumes:
      - peach-data:/data
      - type: bind
        source: ${PEACH_MEDIA_ROOT:-./media}
        target: /media
        read_only: true
        bind:
          propagation: rslave
          create_host_path: false

volumes:
  peach-data:
